services:
  - type: web
    name: eureka-international-invoicing
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: eureka-invoicing-db
          property: connectionString
      - key: NODE_ENV
        value: production

databases:
  - name: eureka-invoicing-db
    databaseName: eureka_invoices
    user: eureka_user
    plan: free
    region: oregon
